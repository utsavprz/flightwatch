name: cf-probe (temporary)
on:
  push:
    branches: [claude/flightwatch-github-actions-9ndmho]
    paths: [.github/workflows/cf-probe.yml, cf_probe.py]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q playwright
      - run: python cf_probe.py
