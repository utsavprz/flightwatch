name: FlightWatch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual check

permissions:
  contents: write             # to save state.json (lowest price seen, last best) between runs

concurrency:
  group: flightwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check flights
        env:
          TZ: America/Chicago
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_watch.py

      - name: Save state
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update price state" && git pull --rebase && git push)
