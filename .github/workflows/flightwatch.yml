name: FlightWatch

on:
  # Stopped: no schedule. Re-add it to resume automatic checks:
  #   schedule:
  #     - cron: "7 */3 * * *"   # restarts the 15-min checking loop below
  workflow_dispatch:          # "Run workflow" button to start the loop now

permissions:
  contents: write             # to save state.json (lowest price seen, last best) between runs

concurrency:
  group: flightwatch
  cancel-in-progress: false   # a newer run waits for the current loop to end, then takes over

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set up VPN
        continue-on-error: true   # direct checks still run if this fails
        env:
          VPN_CONFIGS: ${{ secrets.VPN_CONFIGS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          if [ -z "$VPN_CONFIGS" ]; then
            # No VPN_CONFIGS secret: fall back to a free Cloudflare WARP WireGuard tunnel.
            gh release download -R ViRb3/wgcf -p '*_linux_amd64' -O "$RUNNER_TEMP/wgcf"
            chmod +x "$RUNNER_TEMP/wgcf"
            mkdir -p vpn_configs && cd vpn_configs
            "$RUNNER_TEMP/wgcf" register --accept-tos
            "$RUNNER_TEMP/wgcf" generate
            mv wgcf-profile.conf warp.conf
          fi

      - name: Check flights every 15 minutes
        env:
          TZ: America/Chicago
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPN_CONFIGS: ${{ secrets.VPN_CONFIGS }}
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 330 * 60))
          while :; do
            start=$SECONDS
            git pull -q --rebase -X theirs || true   # pick up config/code edits pushed meanwhile
            if python -c 'import json, sys, datetime as d; sys.exit(0 if d.date.today().isoformat() > json.load(open("config.json"))["stop_after"] else 1)'; then
              echo "Trip window has passed - stopping."
              break
            fi

            timeout -s INT -k 30s 10m python flight_watch.py || echo "::warning::flight check failed"

            git add state.json
            if ! git diff --cached --quiet; then
              git commit -qm "Update price state"
              # Keep this run's (newest) state if anything else pushed meanwhile.
              for i in 1 2 3; do
                git pull -q --rebase -X theirs && git push -q && break
                sleep 5
              done
            fi

            wait=$((900 - (SECONDS - start)))
            [ $((SECONDS + wait)) -lt $end ] || break
            [ $wait -gt 0 ] && sleep $wait
          done
